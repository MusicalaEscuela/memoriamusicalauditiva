<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria Musical · Musicala</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="game">

<h1>🎵 Memoria Musical</h1>
<p>Escucha la secuencia y repítela</p>

<div class="controls">
<button id="startBtn">Iniciar juego</button>
</div>

<div class="pads">

<div class="pad pad1" data-note="C">Do</div>
<div class="pad pad2" data-note="D">Re</div>
<div class="pad pad3" data-note="E">Mi</div>
<div class="pad pad4" data-note="G">Sol</div>

</div>

<div class="info">
<p>Nivel: <span id="level">0</span></p>
<p id="message">Presiona iniciar</p>
</div>

</div>

<script src="app.js"></script>

</body>
</html>
